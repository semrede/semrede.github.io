<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemRede Forum</title>
  <meta name="description" content="The SemRede forum: threads on tech, mesh and radio, energy, food, crypto, community, rides and more. Runs on NOSTR.">
  <meta property="og:title" content="SemRede Forum">
  <meta property="og:description" content="Threads that stay: tech, mesh and radio, energy, food, crypto, community, rides. Runs on NOSTR.">
  <meta property="og:image" content="https://semrede.com/img/hero-landscape.jpg">
  <meta property="og:url" content="https://semrede.com/forum">
  <meta name="theme-color" content="#030706">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Kalam:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/forum.css">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body class="chat-body forum-body">
  <div class="scanlines" aria-hidden="true"></div>


  <header class="site-header container">
    <a class="brand" href="/" aria-label="SemRede home">
      <img class="brand-mark" src="/img/logo-mark.png" width="46" height="46" alt="">
      <span class="wordmark">SemRede</span>
    </a>
    <nav>
      <a href="/#about">About</a>
      <a href="/#week">The week</a>
      <a href="/locations">Locations</a>
      <a href="/registration">Register</a>
      <a class="nav-chat" href="/chat">Chat</a>
      <a class="nav-cta" href="/forum" aria-current="page">Forum</a>
    </nav>
  </header>

  <main class="container chat-main">
    <section class="chat-intro">
      <div class="section-kicker">06 / Forum</div>
      <h1>Forum</h1>
    </section>

    <div class="forum-shell">
      <div class="forum-main">
        <div class="room-bar forum-bar">
          <div class="room-title">
            <span>Open to everyone</span>
          </div>
          <div class="relay-status" title="Connected NOSTR relays">
            <span class="relay-dots" id="relay-dots"></span>
            <span id="relay-count">connecting</span>
          </div>
        </div>

        <section id="view-index" class="forum-view">
          <p class="muted-note" id="forum-loading">Reading the relays...</p>
          <div class="cat-grid" id="category-grid"></div>
          <h2 class="forum-h2">Latest activity</h2>
          <div class="thread-list" id="latest-list"></div>
        </section>

        <section id="view-category" class="forum-view" hidden>
          <a class="back-link" href="#/">Back to categories</a>
          <h2 class="forum-h2" id="cat-name"></h2>
          <p class="cat-intro" id="cat-about"></p>

          <button type="button" class="big-btn btn-teal" id="new-toggle" hidden>Start a thread</button>
          <p class="muted-note" id="new-locked"><a class="text-btn" href="/login">Log in</a> to start a thread.</p>
          <form id="new-thread" class="new-thread stack" hidden>
            <label for="new-title">Title</label>
            <input id="new-title" type="text" maxlength="120" placeholder="What is this about?" required>
            <label for="new-body">Message</label>
            <textarea id="new-body" rows="6" maxlength="8000" placeholder="Details, questions, what you already tried." required></textarea>
            <button type="submit" class="big-btn btn-orange">Post thread</button>
            <p class="form-error" id="new-error" role="alert"></p>
          </form>

          <div class="thread-list" id="cat-threads"></div>
          <p class="muted-note" id="cat-empty" hidden>No threads here yet.</p>
        </section>

        <section id="view-thread" class="forum-view" hidden>
          <a class="back-link" id="thread-cat" href="#/">Back</a>
          <h2 class="forum-h2 thread-h" id="thread-title"></h2>
          <div id="thread-body"></div>
          <div id="comments" class="comments"></div>

          <form id="reply-form" class="reply-form stack" hidden>
            <label for="reply-body">Reply to the thread</label>
            <textarea id="reply-body" rows="4" maxlength="8000" placeholder="Your reply" required></textarea>
            <button type="submit" class="big-btn btn-teal">Post reply</button>
          </form>
          <p class="muted-note" id="reply-locked"><a class="text-btn" href="/login">Log in</a> to reply.</p>
        </section>
      </div>

    </div>
  </main>

  <footer class="site-footer container">
    <span>Coimbra / Portugal</span>
    <span>semrede.com</span>
    <span>October 19 to 24, 2026</span>
  </footer>

  <script src="/js/vendor/nostr.bundle.js"></script>
  <script src="/js/nostr-config.js"></script>
  <script src="/js/nostr-login.js"></script>
  <script src="/js/nostr-common.js"></script>
  <script src="/js/dm.js"></script>
  <script src="/js/account-bar.js"></script>
  <script src="/js/forum.js"></script>
  <script src="/js/nav-menu.js"></script>
</body>
</html>
